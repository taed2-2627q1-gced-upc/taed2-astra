# The reproducible pipeline. `dvc repro` reruns only the stages whose
# dependencies or params actually changed. ${...} values come from params.yaml.
# `-X utf8` keeps MLflow's console output from crashing on Windows when stdout
# is redirected (cp1252 cannot encode its emoji); it is a no-op on Linux.

stages:
  prepare:
    cmd: python -X utf8 -m taed2_astra.data.make_dataset
    deps:
      - data/raw/${dataset.raw_file}
      - src/taed2_astra/data/make_dataset.py
    params:
      - dataset
      - prepare
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet

  validate:
    cmd: python -X utf8 -m taed2_astra.data.validate
    deps:
      - data/processed/train.parquet
      - data/processed/test.parquet
      - src/taed2_astra/data/validate.py
    params:
      - dataset
      - validation
    outs:
      - reports/data_validation.json:
          cache: false   # small and reviewable: committed to Git, not the DVC cache

  benchmark:
    cmd: python -X utf8 -m taed2_astra.modeling.benchmark
    deps:
      - data/processed/train.parquet
      - reports/data_validation.json
      - src/taed2_astra/modeling/benchmark.py
      - src/taed2_astra/modeling/registry.py
      - src/taed2_astra/modeling/evaluate.py
      - src/taed2_astra/modeling/fairness.py
      - src/taed2_astra/features/build_features.py
      - src/taed2_astra/energy.py
    params:
      - dataset
      - train
      - benchmark
      - evaluate.threshold
      - fairness
    metrics:
      - metrics/benchmark.json:
          cache: false

  train:
    cmd: python -X utf8 -m taed2_astra.modeling.train
    deps:
      - data/processed/train.parquet
      - reports/data_validation.json
      - src/taed2_astra/modeling/train.py
      - src/taed2_astra/modeling/registry.py
      - src/taed2_astra/modeling/fairness.py
      - src/taed2_astra/features/build_features.py
      - src/taed2_astra/energy.py
    params:
      - dataset
      - train
      - fairness
    outs:
      - models/model.pkl

  evaluate:
    cmd: python -X utf8 -m taed2_astra.modeling.evaluate
    deps:
      - data/processed/test.parquet
      - models/model.pkl
      - src/taed2_astra/modeling/evaluate.py
      - src/taed2_astra/modeling/predict.py
      - src/taed2_astra/features/build_features.py
      - src/taed2_astra/energy.py
    params:
      - dataset
      - evaluate
    metrics:
      - metrics/metrics.json:
          cache: false

  # Group fairness of the shipped model's decisions on the test split (AIF360), per fairness.attributes.
  # The gates on these numbers live in tests/test_model_quality.py, next to the other release gates.
  fairness:
    cmd: python -X utf8 -m taed2_astra.modeling.fairness
    deps:
      - data/processed/test.parquet
      - models/model.pkl
      - src/taed2_astra/modeling/fairness.py
      - src/taed2_astra/modeling/predict.py
      - src/taed2_astra/features/build_features.py
    params:
      - dataset
      - evaluate.threshold
      - fairness.favorable_label
      - fairness.attributes
    metrics:
      - metrics/fairness.json:
          cache: false

  # "Reporting energy in the model card": the shipped model's CodeCarbon row becomes the
  # Hugging Face co2_eq_emissions metadata at the top of docs/model_card.md. model.pkl and
  # metrics.json are deps so this stage runs after train and evaluate have written emissions.csv.
  co2_report:
    cmd: python -X utf8 -m taed2_astra.energy
    deps:
      - reports/emissions/emissions.csv
      - models/model.pkl
      - metrics/metrics.json
      - data/processed/train.parquet
      - src/taed2_astra/energy.py
    params:
      - train.model
      - model_card

  # Sustainability figures for the report and model card, redrawn whenever CodeCarbon logs a new run.
  plots:
    cmd: python -X utf8 -m taed2_astra.visualization.plots
    deps:
      - reports/emissions/emissions.csv
      - src/taed2_astra/visualization/plots.py
    outs:
      - reports/figures/energy_consumed_per_model.png:
          cache: false
      - reports/figures/duration_vs_energy.png:
          cache: false
