<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" width="1220" height="620" role="img" aria-labelledby="t d"><title id="t">Astra physical architecture</title><desc id="d">Users reach a UPC VM through Cloudflare's tunnel; the VM runs cloudflared and one uvicorn worker, pulls code from GitHub and the model from DagsHub. Developers train on laptops and CI runs on GitHub Actions.</desc><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#EA580C"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker></defs><rect width="1220" height="620" fill="#FFFFFF"/><rect x="20" y="60" width="180" height="250" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="36" y="86" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Users</text><text x="36" y="105" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">any device</text><rect x="240" y="60" width="200" height="250" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/><text x="256" y="86" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400E" text-anchor="start">Cloudflare</text><text x="256" y="105" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">managed edge</text><rect x="490" y="60" width="390" height="380" rx="12" fill="#F5F8FF" stroke="#BFD3F2" stroke-width="1.2"/><text x="506" y="86" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E3A8A" text-anchor="start">UPC virtual machine</text><text x="506" y="105" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Ubuntu · 1 vCPU · 4 GB RAM · 24 GB disk</text><rect x="930" y="60" width="228" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="946" y="86" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">GitHub</text><rect x="930" y="320" width="228" height="240" rx="12" fill="#FFFAF5" stroke="#F5DCC5" stroke-width="1.2"/><text x="946" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#9A3412" text-anchor="start">DagsHub</text><rect x="490" y="466" width="390" height="134" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/><text x="506" y="492" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Developer laptops</text><text x="506" y="511" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">Windows · macOS</text><text x="20" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E3A8A" text-anchor="start">Public request path</text><text x="930" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#9A3412" text-anchor="start">Code, data and model storage</text><rect x="40" y="120" width="140" height="56" rx="28.0" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="110.0" y="143.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Browser</text><text x="1