# Every tunable value lives here. Code reads it, DVC hashes it, Git versions it.
# Changing a value below invalidates exactly the stages that depend on it.

dataset:
  name: prediction-of-sepsis
  raw_file: prediction-of-sepsis.zip   # under data/raw, DVC-tracked
  raw_member: Dataset.csv              # the CSV inside the archive
  target: SepsisLabel
  classes: [0, 1]
  group: Patient_ID                    # rows of one patient never straddle a split
  drop: ["Unnamed: 0"]                 # pandas index column leaked by the export

prepare:
  test_size: 0.2
  random_state: 42

train:
  random_state: 42
  model: hist_gradient_boosting        # candidate written to models/model.pkl
  candidates:
    logistic_regression:
      estimator: logistic_regression
      C: 1.0
      max_iter: 1000
      class_weight: balanced
    hist_gradient_boosting:
      estimator: hist_gradient_boosting
      learning_rate: 0.1
      max_iter: 300
      max_leaf_nodes: 31
      min_samples_leaf: 100
      class_weight: balanced
    tabpfn:
      # Weights: https://huggingface.co/Prior-Labs/TabPFN-v2-clf
      # Optional dependency: uv sync --group foundation
      estimator: tabpfn
      n_estimators: 4
      device: cpu
      max_train_rows: 10000
    ensemble_soft:
      estimator: soft_voting
      members: [hist_gradient_boosting, logistic_regression]
      weights: null                     # null = equal weights
    ensemble_stacking:
      estimator: stacking
      members: [hist_gradient_boosting, logistic_regression]
      cv: 3

benchmark:
  models: [logistic_regression, hist_gradient_boosting, tabpfn, ensemble_soft, ensemble_stacking]
  cv_folds: 3
  max_rows: null                        # e.g. 200000 for a fast iteration loop
  latency_batch_size: 1000
  rank_by: pr_auc

evaluate:
  threshold: 0.5

# Data contract checked by the validate stage (Great Expectations) on both splits.
# Critical checks stop the pipeline; warnings are recorded in reports/data_validation.json.
validation:
  min_rows: 10000
  label_rate: [0.005, 0.05]          # PhysioNet 2019: ~1.8 % of ICU hours fall in the sepsis window
  binary: [Gender, Unit1, Unit2]
  complete: [Hour, Age, Gender, ICULOS]  # charted for every row; a gap means a broken export
  dtypes: [int64, float64]           # build_preprocessor selects by dtype: a string column would change the model
  range_mostly: 0.999                # tolerate rare charting errors; a unit change across a column still fails
  # Physiologically plausible bounds, deliberately wide. Keys are also the expected feature set.
  ranges:
    Hour: [0, 400]
    HR: [20, 300]
    O2Sat: [20, 100]
    Temp: [20, 45]
    SBP: [20, 300]
    MAP: [20, 300]
    DBP: [20, 300]
    Resp: [1, 100]
    EtCO2: [10, 100]
    BaseExcess: [-40, 40]
    HCO3: [0, 60]
    FiO2: [0.21, 1.0]                # a fraction: values like 40 or 4000 are percentages typed in the wrong unit
    pH: [6.5, 8.0]
    PaCO2: [10, 150]
    SaO2: [20, 100]
    AST: [0, 10000]
    BUN: [0, 300]
    Alkalinephos: [0, 4000]
    Calcium: [0, 30]
    Chloride: [20, 150]
    Creatinine: [0, 50]
    Bilirubin_direct: [0, 50]
    Glucose: [10, 1000]
    Lactate: [0, 35]
    Magnesium: [0, 10]
    Phosphate: [0, 20]
    Potassium: [1, 12]
    Bilirubin_total: [0, 50]
    TroponinI: [0, 500]
    Hct: [5, 80]
    Hgb: [2, 30]
    PTT: [10, 250]
    WBC: [0, 500]
    Fibrinogen: [30, 2000]
    Platelets: [0, 2500]
    Age: [0, 120]
    Gender: [0, 1]
    Unit1: [0, 1]
    Unit2: [0, 1]
    HospAdmTime: [-10000, 100]       # hours from hospital to ICU admission, negative by definition
    ICULOS: [1, 400]

# Release gates for the shipped model, checked by tests/test_model_quality.py on the test split.
model_quality:
  min_roc_auc: 0.78
  min_pr_auc_lift: 4.0               # PR-AUC as a multiple of the positive rate (the no-skill baseline)
  min_recall: 0.55                   # at evaluate.threshold: missing a septic patient is the costly error
  slices: [Gender, Unit1]            # subgroups that must not be served much worse than the rest
  max_slice_roc_auc_gap: 0.1
  # Group fairness over fairness.attributes (AIF360). Only error-rate parity is gated: sepsis
  # prevalence differs between groups, so parity of the alert rate (disparate impact) is reported, not enforced.
  max_equal_opportunity_gap: 0.1     # |recall difference|: missed sepsis must not concentrate in one group
  max_average_odds_gap: 0.1          # |mean of the recall and false-alarm-rate differences|
  # Clinical deterioration must not lower the average predicted risk.
  directional:
    HR: 40
    Temp: 2
    Resp: 15
    MAP: -30
    Lactate: 4

# Group fairness audit (fairness stage) and the optional training-time mitigation (train, benchmark).
fairness:
  # An alert brings a clinician to the bedside: for a septic patient, being flagged is the outcome to want.
  favorable_label: 1
  # Each attribute is split into the privileged (reference) group and the rest; metrics are rest minus reference.
  # A cutoff binarises a continuous column first: value >= cutoff becomes 1.
  attributes:
    Gender:
      privileged: 1                  # 1 = male, 0 = female (docs/dataset_card.md)
    Age:
      cutoff: 65
      privileged: 0                  # reference: patients under 65
  mitigation:
    method: none                     # none | reweighing (AIF360 pre-processing: per-row training weights)
    attribute: Gender                # must be complete (validation.complete): every row needs a weight
# Serving contract. Field types and required fields come from `validation` above.
api:
  max_batch_size: 1000               # one request scores at most this many patient-hours (VM has 4 GB RAM)
  max_errors: 20                     # a 422 lists at most this many problems: a 0.6 MB request must not get a 6 MB answer
  # Hard limits per feature: /predict rejects (422) only values that cannot be a real
  # measurement in the expected unit. They are deliberately wider than validation.ranges,
  # because the sickest patients are exactly the ones an early-warning model must score:
  # a value inside these limits but outside validation.ranges is scored and returned with
  # a warning: the training data was checked against those ranges, so such values are rare in it.
  # Keys must match validation.ranges.
  limits:
    Hour: [0, 10000]                 # hours since ICU admission; stays can last months
    HR: [0, 350]                     # 0 = asystole; extreme bradycardia must still be scored
    O2Sat: [0, 100]                  # percent
    Temp: [10, 47]                   # degrees C; 98.6 is Fahrenheit and is rejected
    SBP: [0, 350]
    MAP: [0, 300]
    DBP: [0, 300]
    Resp: [0, 100]
    EtCO2: [0, 150]
    BaseExcess: [-50, 50]
    HCO3: [0, 70]
    FiO2: [0.21, 1.0]                # a fraction: 40 is a percentage and is rejected
    pH: [6.0, 8.0]
    PaCO2: [5, 250]
    SaO2: [0, 100]
    AST: [0, 50000]
    BUN: [0, 400]
    Alkalinephos: [0, 10000]
    Calcium: [0, 30]
    Chloride: [0, 200]
    Creatinine: [0, 60]
    Bilirubin_direct: [0, 80]
    Glucose: [0, 3000]               # hyperosmolar states exceed 2000 mg/dL
    Lactate: [0, 50]
    Magnesium: [0, 20]
    Phosphate: [0, 30]
    Potassium: [0.5, 15]
    Bilirubin_total: [0, 100]
    TroponinI: [0, 1000]
    Hct: [0, 100]                    # percent
    Hgb: [0, 30]
    PTT: [5, 500]
    WBC: [0, 1000]                   # leukaemic counts exceed the training range
    Fibrinogen: [0, 3000]
    Platelets: [0, 5000]
    Age: [0, 120]
    Gender: [0, 1]
    Unit1: [0, 1]
    Unit2: [0, 1]
    HospAdmTime: [-100000, 100]      # hours from hospital to ICU admission
    ICULOS: [1, 10000]
  # Relations between fields, checked whenever every field in a rule is sent. A broken one is
  # scored with a warning, not rejected: it is almost always a charting error, and the record
  # still describes a real patient. Share of train.parquet rows that break each rule is noted.
  ordered:                           # [low, high]: low must not exceed high
    - [DBP, MAP]                     # 0.64 %
    - [MAP, SBP]                     # 0.09 %
    - [DBP, SBP]                     # 0.01 %
    - [Bilirubin_direct, Bilirubin_total]  # 0.14 %
    - [Hour, ICULOS]                 # 0 %: ICULOS counts from 1, Hour from 0
  one_hot:                           # exactly one field of each group is 1
    - [Unit1, Unit2]                 # 0 %: every patient is in exactly one ICU type
  # Named patient-hours offered in the /docs "Try it out" dropdown. The first one is also the
  # default request body. Tests check that every example is accepted by the contract.
  examples:
    deteriorating:
      summary: High risk - deteriorating patient
      description: Fever, tachycardia, fast breathing, low MAP, raised lactate and WBC, on oxygen.
      record:
        Hour: 5
        HR: 104
        O2Sat: 94
        Temp: 38.6
        SBP: 102
        MAP: 68
        DBP: 52
        Resp: 26
        FiO2: 0.4
        Lactate: 3.1
        WBC: 15.2
        Creatinine: 1.4
        Platelets: 140
        Age: 67
        Gender: 1
        Unit1: 1
        Unit2: 0
        HospAdmTime: -12.5
        ICULOS: 6
    stable:
      summary: Low risk - stable patient
      description: Normal vitals and labs on room air, three hours into the ICU stay.
      record:
        Hour: 2
        HR: 72
        O2Sat: 98
        Temp: 36.8
        SBP: 125
        MAP: 88
        DBP: 70
        Resp: 15
        FiO2: 0.21
        Lactate: 1.0
        WBC: 7.5
        Creatinine: 0.9
        Platelets: 250
        Age: 45
        Gender: 0
        Unit1: 0
        Unit2: 1
        HospAdmTime: -2.0
        ICULOS: 3
    minimal:
      summary: Only the required fields
      description: Every unmeasured value is left out; the model imputes it.
      record:
        Hour: 2
        Age: 45
        Gender: 0
        ICULOS: 3
    bradycardia:
      summary: Extreme value - scored with a warning
      description: HR 19 is possible but below the training range, so the risk comes back with a warning.
      record:
        Hour: 5
        HR: 19
        Temp: 38.6
        Age: 67
        Gender: 1
        ICULOS: 6

mlflow:
  experiment_name: taed2-astra
  # Override with MLFLOW_TRACKING_URI=sqlite:///mlflow.db to log runs locally.
  tracking_uri: https://dagshub.com/Santi-49/taed2-astra.mlflow

model_card:
  # Facts for the Hugging Face co2_eq_emissions metadata that CodeCarbon cannot measure.
  # Everything measurable (emissions, energy, location, hardware, time) comes from emissions.csv.
  training_type: pre-training           # trained from scratch, no pre-trained weights reused
  optimization_techniques: >-
    histogram-based gradient boosting (binned features); ensembles rejected because their
    extra energy bought no meaningful PR-AUC gain
