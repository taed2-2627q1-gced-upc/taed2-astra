# Every tunable value lives here. Code reads it, DVC hashes it, Git versions it.
# Changing a value below invalidates exactly the stages that depend on it.

dataset:
  name: prediction-of-sepsis
  raw_file: prediction-of-sepsis.zip   # under data/raw, DVC-tracked
  raw_member: Dataset.csv              # the CSV inside the archive
  target: SepsisLabel
  classes: [0, 1]
  group: Patient_ID                    # rows of one patient never straddle a split
  drop: ["Unnamed: 0"]                 # pandas index column leaked by the export

prepare:
  test_size: 0.2
  random_state: 42

train:
  random_state: 42
  model: hist_gradient_boosting        # candidate written to models/model.pkl
  candidates:
    logistic_regression:
      estimator: logistic_regression
      C: 1.0
      max_iter: 1000
      class_weight: balanced
    hist_gradient_boosting:
      estimator: hist_gradient_boosting
      learning_rate: 0.1
      max_iter: 300
      max_leaf_nodes: 31
      min_samples_leaf: 100
      class_weight: balanced
    tabpfn:
      # Weights: https://huggingface.co/Prior-Labs/TabPFN-v2-clf
      # Optional dependency: uv sync --group foundation
      estimator: tabpfn
      n_estimators: 4
      device: cpu
      max_train_rows: 10000
    ensemble_soft:
      estimator: soft_voting
      members: [hist_gradient_boosting, logistic_regression]
      weights: null                     # null = equal weights
    ensemble_stacking:
      estimator: stacking
      members: [hist_gradient_boosting, logistic_regression]
      cv: 3

benchmark:
  models: [logistic_regression, hist_gradient_boosting, tabpfn, ensemble_soft, ensemble_stacking]
  cv_folds: 3
  max_rows: null                        # e.g. 200000 for a fast iteration loop
  latency_batch_size: 1000
  rank_by: pr_auc

evaluate:
  threshold: 0.5

explain:
  # SHAP on a sample of the test split (stage `explain`, gates in tests/test_explainability.py).
  sample_rows: 5000                     # ~85 septic hours; TreeExplainer takes seconds on a laptop
  random_state: 42
  top_k: 15                             # inputs shown in the figures
  min_measured_rows: 50                 # a direction check needs this many rows where the variable was measured
  min_abs_spearman: 0.3                 # value vs SHAP contribution must be at least this monotonic
  # +1: a higher value must push towards an alert; -1: a lower value must.
  # Temp is left out on purpose: both fever and hypothermia are sepsis signs, so its effect is U-shaped.
  expected_direction:
    HR: 1
    Resp: 1
    MAP: -1
    SBP: -1
    Lactate: 1
    Creatinine: 1
    BUN: 1

mlflow:
  experiment_name: taed2-astra
  # Override with MLFLOW_TRACKING_URI=sqlite:///mlflow.db to log runs locally.
  tracking_uri: https://dagshub.com/Santi-49/taed2-astra.mlflow

model_card:
  # Facts for the Hugging Face co2_eq_emissions metadata that CodeCarbon cannot measure.
  # Everything measurable (emissions, energy, location, hardware, time) comes from emissions.csv.
  training_type: pre-training           # trained from scratch, no pre-trained weights reused
  optimization_techniques: >-
    histogram-based gradient boosting (binned features); ensembles rejected because their
    extra energy bought no meaningful PR-AUC gain
