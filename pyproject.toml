# ---------------------------------------------------------------------------
# taed2-astra - single source of truth for packaging, dependencies and tooling.
# Managed with uv:  uv sync
# ---------------------------------------------------------------------------

[project]
name = "taed2-astra"
version = "0.1.0"
description = "Sepsis risk and ICU readmission prediction service (TAED2, team Astra)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Santiago Romagosa" },
    { name = "Pablo Fernandez" },
    { name = "Elena Sola" },
    { name = "Julia Camus" },
]

dependencies = [
    # core data / modelling
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",          # parquet interchange between pipeline stages
    "pyyaml>=6.0",            # params.yaml
    "python-dotenv>=1.0",     # loads .env so credentials stay out of Git
    # reproducibility / tracking
    "mlflow>=2.22",
    "dvc[s3]>=3.50",          # the s3 extra is required by the DagsHub remote
    "codecarbon>=2.4",
    # data validation
    "great-expectations>=1.0",
    # serving
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # fairness audit and mitigation; capped because 0.x minors have changed public APIs
    "aif360>=0.6.1,<0.7",
]

[dependency-groups]
# uv installs this group by default, so `uv sync` is all a teammate needs.
dev = [
    "ruff>=0.12",
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",            # FastAPI TestClient transport
    "pylint>=4.1.2",          # static analysis: design, complexity and a global score
    "pynblint>=0.1.3",        # notebook + repository QA
    "click<8.2",
    "pre-commit>=3.7",
]
notebooks = [
    "jupyterlab>=4.1",
    "seaborn>=0.13",
]
# Optional: the Hugging Face-hosted tabular foundation model (pulls torch).
# Install with `uv sync --group foundation`; the benchmark skips it otherwise.
foundation = [
    "tabpfn>=2.0",
    "torch>=2.1",             # declared so [tool.uv.sources] can pin it to the CPU index
]

[project.scripts]
# Thin CLI entry points so DVC stages and humans invoke the same code path.
astra-prepare   = "taed2_astra.data.make_dataset:main"
astra-validate  = "taed2_astra.data.validate:main"
astra-benchmark = "taed2_astra.modeling.benchmark:main"
astra-train     = "taed2_astra.modeling.train:main"
astra-evaluate  = "taed2_astra.modeling.evaluate:main"
astra-fairness  = "taed2_astra.modeling.fairness:main"
astra-co2       = "taed2_astra.energy:main"
astra-plots     = "taed2_astra.visualization.plots:main"

# TabPFN pulls torch. The team has no GPU, so resolve torch from the CPU-only
# index and skip the multi-gigabyte CUDA wheels the default index would lock.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taed2_astra"]

# ---------------------------------------------------------------------------
# Tooling - ruff (fast, runs on every commit) + pylint (deeper static analysis)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "PL",   # pylint
    "D",    # pydocstyle - docstrings are a graded deliverable
]
ignore = [
    "D100",  # module docstring - covered by review, not the linter
    "D104",  # package docstring in __init__.py
]

[tool.ruff.lint.per-file-ignores]
# Asserting on literal HTTP status codes is clearer than naming a constant.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["taed2_astra"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Pylint complements ruff with semantic checks (design limits, class attributes,
# name resolution across modules) and a global score we track over time.
[tool.pylint.main]
source-roots = ["src"]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 120          # same limit as ruff: one style for the whole repo

[tool.pylint.basic]
good-names = ["X", "y", "i", "j", "df", "_"]   # ML conventions (scikit-learn API)

[tool.pylint.design]
max-locals = 15                # keep the default: refactor instead of raising it

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=taed2_astra --cov-report=term-missing"
markers = [
    "slow: tests that train a model or touch the full dataset",
    "integration: tests that require data or a running service",
]

[tool.coverage.run]
source = ["src/taed2_astra"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
# A ratchet, not a target: CI measures 59 % without data on disk. Raise it as tests land; never lower it.
fail_under = 55
